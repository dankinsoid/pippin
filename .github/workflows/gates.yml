# @ai-generated(solo)
# `make gates` on GitHub-hosted macOS runners (docs/notes/gates.md, "CI").
name: gates

# Docs are prose to the gates; the doc checks they do run (open-items, port-audit) are part of local `make gates`.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  # x86_64 runs here and when a dispatch asks for both; 23:00 UTC is night in Yerevan.
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      arches:
        description: arm64 alone, or both architectures (a change to a per-architecture spot asks for both)
        type: choice
        options: [arm64, both]
        default: arm64
      target:
        description: the make target; a long opt-in one such as test-eval-compiled runs by hand only
        default: gates
      test_timeout:
        description: TEST_TIMEOUT, seconds per build, listing and shard
        default: '1200'
      suites:
        description: TEST_SUITES, to rerun a failed shard's suites alone (its report prints them)
        default: ''
      shards:
        description: TEST_SHARDS, to deal the suites otherwise than the gate's committed count; empty runs the gate's deal
        default: ''
      make_args:
        description: variables for make, space-separated (BASE=<ref> for bench-ab)
        default: ''

# A push supersedes its ref's last run; each dispatch or nightly run is its own group, so a series runs side by side.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  CLOJURE_CLI_VERSION: 1.12.6.1673
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # A cold ASan build alone takes 290 s on the 4-core Intel runner; the Makefile default is sized for an M3.
  TEST_TIMEOUT: ${{ inputs.test_timeout || '1200' }}
  # A slow x86_64 runner ran every suite 2.7× slower, and SwiftStubTests' cold stub generation passed 300 s.
  CLJ_TEST_HANG_S: 900
  TEST_SUITES: ${{ inputs.suites }}
  TEST_SHARDS: ${{ inputs.shards }}

jobs:
  gates:
    name: gates (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: ${{ (inputs.target || 'gates') == 'gates' && 75 || 340 }}
    strategy:
      fail-fast: false
      # The x86_64 job takes twice arm64's time and the plan's macOS runners are five: it runs nightly or on asking.
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.arches == 'both')
          && '[{"arch":"arm64","runner":"macos-26","required":true},{"arch":"x86_64","runner":"macos-26-intel","required":true}]'
          || '[{"arch":"arm64","runner":"macos-26","required":true}]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          # A label that moves to another architecture must fail here, not test the wrong one quietly.
          test "$(uname -m)" = "${{ matrix.arch }}"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
          echo "cpus $(sysctl -n hw.ncpu), memory $(($(sysctl -n hw.memsize) / 1073741824)) GB"

      - name: GNU timeout
        run: |
          command -v timeout || brew install coreutils
          timeout --version | head -1

      - name: Clojure CLI
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/clojure/brew-install/releases/download/$CLOJURE_CLI_VERSION/posix-install.sh"
          sh posix-install.sh --prefix "$RUNNER_TEMP/clojure"
          echo "$RUNNER_TEMP/clojure/bin" >> "$GITHUB_PATH"
          java -version

      - name: Maven cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('Makefile') }}
          restore-keys: m2-

      - name: SwiftPM repository cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.arch }}-

      # Self-validating content keys: a restored entry hits exactly or is ignored.
      - name: Restore the corpus cache
        uses: actions/cache/restore@v6
        with:
          path: .build/corpus-cache
          key: corpus-${{ runner.arch }}-${{ github.sha }}
          restore-keys: corpus-${{ runner.arch }}-

      - name: Corpus cache contents before
        run: (ls -d .build/corpus-cache/*/*/ 2>/dev/null || true) | sort > "$RUNNER_TEMP/corpus-before"

      # The stub generator's and the Swift fixture's caches, content-keyed the same way (docs/notes/gates.md, "CI").
      - name: Restore the Swift stubs cache
        uses: actions/cache/restore@v6
        with:
          path: .build/swift-stubs
          key: swift-stubs-${{ runner.arch }}-${{ github.sha }}
          restore-keys: swift-stubs-${{ runner.arch }}-

      - name: Swift stubs cache contents before
        run: (ls -d .build/swift-stubs/*/*/ .build/swift-stubs/cache/*/*/ 2>/dev/null || true) | sort > "$RUNNER_TEMP/stubs-before"

      # The parser fuzzers' grown corpus carries from run to run (docs/notes/fuzzing.md, "Parser fuzzing").
      - name: Restore the parser fuzzing corpus
        if: ${{ inputs.target == 'fuzz-parsers' }}
        uses: actions/cache/restore@v6
        with:
          path: .build/fuzz-parsers/corpus
          key: fuzz-parsers-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: fuzz-parsers-${{ runner.arch }}-

      - name: make ${{ inputs.target || 'gates' }}
        # corpus-bench caps itself at 150 min (scripts/corpus-bench.py); this is the backstop for its builds.
        # fuzz-parsers: a check run passes FUZZ_PARSERS_TIME of about 30 min in all; every phase is bounded (fuzz/parsers/run.sh).
        timeout-minutes: ${{ inputs.target == 'corpus-bench' && 180 || inputs.target == 'fuzz-parsers' && 70 || 330 }}
        env:
          TARGET: ${{ inputs.target || 'gates' }}
          MAKE_ARGS: ${{ inputs.make_args }}
        run: |
          set -o pipefail
          # Split on purpose: one word per variable.
          make "$TARGET" $MAKE_ARGS 2>&1 | tee "$RUNNER_TEMP/gates.log"

      - name: Gate times
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### gates (${{ matrix.arch }}), corpus cache: $(grep -c 'corpus: cache hit' "$RUNNER_TEMP/gates.log") hits, $(grep -c 'corpus: cache miss' "$RUNNER_TEMP/gates.log") misses"
            echo '```'
            grep -E '^gate|^gates total' "$RUNNER_TEMP/gates.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git status --short

      - name: Corpus bench report
        if: ${{ !cancelled() && inputs.target == 'corpus-bench' }}
        run: cat .build/corpus-bench/report.md >> "$GITHUB_STEP_SUMMARY" || true

      # Per-run logs and the sampled profiles, which the report only summarizes.
      - name: Corpus bench logs
        if: ${{ !cancelled() && inputs.target == 'corpus-bench' }}
        uses: actions/upload-artifact@v7
        with:
          name: corpus-bench-${{ matrix.arch }}
          path: |
            .build/corpus-bench/report.md
            .build/corpus-bench/facts-coverage.md
            .build/corpus-bench/logs
          retention-days: 30

      - name: Save the parser fuzzing corpus
        if: ${{ !cancelled() && inputs.target == 'fuzz-parsers' }}
        uses: actions/cache/save@v6
        with:
          path: .build/fuzz-parsers/corpus
          key: fuzz-parsers-${{ runner.arch }}-${{ github.run_id }}

      # Each finding as found and minimized, the logs that reproduce it, and the grown corpus.
      - name: Parser fuzzing findings
        if: ${{ !cancelled() && inputs.target == 'fuzz-parsers' }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-parsers-${{ matrix.arch }}
          path: |
            .build/fuzz-parsers/findings
            .build/fuzz-parsers/logs
            .build/fuzz-parsers/corpus
          retention-days: 14
          if-no-files-found: ignore

      # Each shard's log and event stream, and times.json for `scripts/test-shards.py record`.
      - name: Shard logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shards-${{ matrix.arch }}
          path: .build/*/shards
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      # One entry per library survives: a run either hits the restored one or writes a newer one.
      - name: Prune the corpus cache
        id: corpus
        if: ${{ !cancelled() }}
        run: |
          for library in .build/corpus-cache/*/; do
            [ -d "$library" ] || continue
            ls -td "$library"*/ | tail -n +2 | xargs rm -rf
          done
          (ls -d .build/corpus-cache/*/*/ 2>/dev/null || true) | sort > "$RUNNER_TEMP/corpus-after"
          if cmp -s "$RUNNER_TEMP/corpus-before" "$RUNNER_TEMP/corpus-after"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the corpus cache
        if: ${{ !cancelled() && steps.corpus.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build/corpus-cache
          key: corpus-${{ runner.arch }}-${{ github.sha }}

      # Each build configuration's Pippin.swiftmodule keys its own stubs: four per module survive, two fixtures.
      - name: Prune the Swift stubs cache
        id: stubs
        if: ${{ !cancelled() }}
        run: |
          rm -rf .build/swift-stubs/*/*.tmp-* .build/swift-stubs/cache/*/*.tmp-*
          for module in .build/swift-stubs/cache/*/; do
            [ -d "$module" ] || continue
            ls -td "$module"*/ | tail -n +5 | xargs rm -rf
          done
          [ -d .build/swift-stubs/fixture ] && ls -td .build/swift-stubs/fixture/*/ | tail -n +3 | xargs rm -rf
          (ls -d .build/swift-stubs/*/*/ .build/swift-stubs/cache/*/*/ 2>/dev/null || true) | sort > "$RUNNER_TEMP/stubs-after"
          if cmp -s "$RUNNER_TEMP/stubs-before" "$RUNNER_TEMP/stubs-after"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the Swift stubs cache
        if: ${{ !cancelled() && steps.stubs.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build/swift-stubs
          key: swift-stubs-${{ runner.arch }}-${{ github.sha }}
